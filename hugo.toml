baseURL = "https://intentius.io/"
title = "Intentius"
locale = "en-us"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true

[params]
  description = "Intentius helps teams adopt terragucci, the open-source way to plan, approve and apply Terraform from pull requests in your own CI."
  githubOrg = "https://github.com/intentius"
  blog = "https://lex00.github.io/"
  # Rendered as a mailto link only; the address is never printed. Leave empty to hide the line.
  contactEmail = "albert.a.artigues@gmail.com"

[menus]
  [[menus.main]]
    name = "terragucci"
    pageRef = "/terragucci"
    weight = 5
  [[menus.main]]
    name = "Work"
    pageRef = "/work"
    weight = 10
  [[menus.main]]
    name = "Tools"
    pageRef = "/tools"
    weight = 20
  [[menus.main]]
    name = "Compare"
    pageRef = "/compare"
    weight = 30
  [[menus.main]]
    name = "Accessible Ops"
    pageRef = "/accessible-ops"
    weight = 40
  [[menus.main]]
    name = "Writing"
    pageRef = "/writing"
    weight = 50
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 60
  [[menus.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 70

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
